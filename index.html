<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile PWA & Theme Configuration -->
    <meta name="theme-color" content="#1C0D06" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- OpenGraph / Social Meta -->
    <meta property="og:title" content="Dulcito - Ponche Crema & Dulces Tradicionales" />
    <meta property="og:description" content="Tienda virtual artesanal de ponche crema tradicional, dulce de leche de olla y dulces criollos hechos con amor y sabor a hogar." />
    <meta property="og:type" content="website" />

  <body class="bg-[#1A0B05] text-[#2C1810] antialiased selection:bg-[#EAD7C3] selection:text-[#3D1E10]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Dulcito high-speed Service Worker on mobile devices
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
